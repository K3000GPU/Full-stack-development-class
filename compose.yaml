name: campus-message-board

services:
  db:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先在 .env 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: campus_message_board
      MYSQL_USER: campus_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?请先在 .env 设置 DB_PASSWORD}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # TCP 查询成功才就绪，避免把首次初始化时的临时 socket 服务当作就绪。
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: campus_message_board
      DB_USERNAME: campus_app
      DB_PASSWORD: ${DB_PASSWORD:?请先在 .env 设置 DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - ./backend:/app
      - go_modules:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://127.0.0.1:8080/api/messages"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 300s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      DEV_SERVER_HOST: 0.0.0.0
      API_PROXY_TARGET: http://backend:8080
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./scripts:/workspace/scripts:ro
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/api/messages').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  mysql_data:
  frontend_node_modules:
  go_modules:
  go_build_cache:
