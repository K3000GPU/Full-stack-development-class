server:
  port: 8080

spring:
  application:
    name: campus-message-board
  datasource:
    # 只连接教师明确指定的教学库；数据库名、账号和密码必须由本机提供。
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  sql:
    init:
      mode: always
      encoding: UTF-8
      # schema.sql 只建缺失的表；建库和授权请按 README 在指定教学库执行。
      schema-locations: classpath:schema.sql

